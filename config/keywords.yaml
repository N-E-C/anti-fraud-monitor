  # -------------------------------------------------------
  # 反诈核验链接特征（用户贴出短信截图时常见）
  # -------------------------------------------------------
  verification_links:
    - "verify.online-cmcc.cn"
    - "nx.10086.cn/capability/secondaryCertificationNew"
    - "edcreg-web/videorealname"
    - "wechatRealVerify"
    - "sc-enter.html"
    - "sc-center.html"

# -------------------------------------------------------
# 排除词（过滤掉不相关内容）
# -------------------------------------------------------
exclude_keywords:
  - "游戏封号"
  - "微信封号"
  - "支付宝"
  - "银行卡"

# -------------------------------------------------------
# 监测平台
# -------------------------------------------------------
platforms:
