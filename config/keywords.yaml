      - "1510"  # 1510x中15109为宁夏
      - "1520"  # 1520x中15209为宁夏
      - "1570"  # 1570x中15709为宁夏
      - "1580"  # 1580x中15809为宁夏
      - "1590"  # 1590x中15909为宁夏
      # 17x号段
      - "1780"  # 1780x中17809为宁夏
      # 18x号段
      - "1820"  # 1820x中18209为宁夏
      - "1830"  # 1830x中18309为宁夏
      - "1840"  # 1840x中18409为宁夏
      - "1870"  # 1870x中18709为宁夏
