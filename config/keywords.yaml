# -------------------------------------------------------
# 排除词（过滤掉不相关内容）
# -------------------------------------------------------
exclude_keywords:
  - "游戏封号"
  - "微信封号"
  - "支付宝"
  - "银行卡"

# -------------------------------------------------------
# 监测平台
# -------------------------------------------------------
