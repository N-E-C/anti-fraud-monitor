# 反诈舆情关键词配置
# 分级管理：高风险 / 中风险 / 低风险

keywords:
  # -------------------------------------------------------
  # 高风险关键词（直接投诉/负面舆情）
  # -------------------------------------------------------
  high_risk:
    - "中国移动封号"
    - "中国移动停机"
    - "被移动关停"
    - "反诈误封"
    - "反诈误伤"
    - "号码被封"
    - "移动乱封号"
    - "反诈骚扰"
    - "无故停机"
    - "强制关停"
    - "移动侵权"
    - "恶意封号"
    - "12321投诉"
    - "工信部投诉"
    - "乱停机"
    - "误关停"

  # -------------------------------------------------------
  # 中风险关键词（质疑/不满）
  # -------------------------------------------------------
  medium_risk:
    - "反诈"
    - "号码关停"
    - "中国移动投诉"
    - "移动服务差"
    - "12381"
    - "国家反诈"
    - "运营商监管"
    - "停机原因"
    - "移动客服不回应"
    - "申诉无效"
    - "号码异常"
    - "被限制"
    - "打不了电话"

  # -------------------------------------------------------
  # 监控关键词（中性监测）
  # -------------------------------------------------------
  neutral:
    - "反诈中心"
    - "防诈骗"
    - "电信诈骗"
    - "宁夏反诈"
    - "移动反诈"
    - "反诈平台"
    - "断卡行动"
    - "反诈电话"

  # -------------------------------------------------------
  # 宁夏区域特征关键词（用于识别宁夏舆情）
  # -------------------------------------------------------
  ningxia_identifiers:
    # 省级标识
    - "宁夏移动"
    - "宁夏联通"
    - "宁夏电信"
    - "宁夏反诈中心"
    - "宁夏自治区反诈中心"
    - "宁夏公安反诈中心"
    # 五个地市反诈中心
    - "银川市公安局反诈中心"
    - "银川反诈"
    - "石嘴山市公安局反诈中心"
    - "石嘴山反诈"
    - "吴忠市公安局反诈中心"
    - "吴忠反诈"
    - "固原市公安局反诈中心"
    - "固原反诈"
    - "中卫市公安局反诈中心"
    - "中卫反诈"

  # -------------------------------------------------------
  # 手机号段（宁夏移动号段 - 09结尾为宁夏）
  # -------------------------------------------------------
