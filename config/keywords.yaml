  # -------------------------------------------------------
  # 反诈核验链接特征（用户贴出短信截图时常见）
  # -------------------------------------------------------
  verification_links:
    - "verify.online-cmcc.cn"
    - "nx.10086.cn/capability/secondaryCertificationNew"
    - "edcreg-web/videorealname"
    - "wechatRealVerify"
    - "sc-enter.html"
