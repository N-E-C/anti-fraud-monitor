      # 13x号段
      - "1346"  # 1346x中13469为宁夏
      - "1351"  # 1351x中13519为宁夏
      - "1361"  # 1361x中13619为宁夏
      - "1370"  # 1370x中13709为宁夏
      - "1389"  # 1389x中13895为宁夏
      - "1399"  # 1399x中13995为宁夏
      # 14x号段
      - "1470"  # 1470x中14709为宁夏
      # 15x号段
